# Publication d'une version, declenchee par une etiquette : git tag v3.3.0
#
#   1. verifie que l'etiquette, le programme, l'installeur et les proprietes de
#      l'executable portent le meme numero ;
#   2. execute les tests, construit l'executable puis l'installeur ;
#   3. publie l'installeur et son empreinte SHA-256 dans une release GitHub ;
#   4. met a jour derniere_version.json sur main (version, lien, empreinte).
#
# Le manifeste n'est modifie qu'en dernier, une fois l'installeur en ligne :
# aucun poste ne peut se voir annoncer une version encore introuvable.
name: Publication

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publication:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependances
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: |
          foreach ($suite in "test_versions", "test_koboimp", "test_ameliorations",
                             "test_repetitions", "smoke_ui") {
            python "tests/$suite.py"
            if ($LASTEXITCODE) { throw "Echec de la suite $suite" }
          }

      - name: Executable
        run: python -m PyInstaller --noconfirm --clean KoboImporter.spec

      - name: Installeur
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { exit 1 }
          }
          & $iscc installer.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Empreinte
        id: empreinte
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $installeur = "installeur\KoboImporter_${version}_installation.exe"
          if (-not (Test-Path $installeur)) { throw "Installeur introuvable : $installeur" }
          $sha = (Get-FileHash -Algorithm SHA256 $installeur).Hash.ToLower()
          $nom = Split-Path $installeur -Leaf
          # Format de sha256sum : verifiable aussi sans l'application.
          "$sha  $nom" | Out-File -Encoding ascii "$installeur.sha256"
          "version=$version"       >> $env:GITHUB_OUTPUT
          "installeur=$installeur" >> $env:GITHUB_OUTPUT
          "sha256=$sha"            >> $env:GITHUB_OUTPUT
          "Empreinte SHA-256 : ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Les nouveautes viennent du manifeste, redige avant l'etiquette.
          $manifeste = Get-Content derniere_version.json -Raw -Encoding utf8 | ConvertFrom-Json
          @(
            $manifeste.notes
            ""
            "Empreinte SHA-256 de l'installeur : ``${{ steps.empreinte.outputs.sha256 }}``"
          ) | Out-File -Encoding utf8 notes.md
          gh release create "${{ github.ref_name }}" `
            "${{ steps.empreinte.outputs.installeur }}" `
            "${{ steps.empreinte.outputs.installeur }}.sha256" `
            --title "Kobo Importer ${{ steps.empreinte.outputs.version }}" `
            --notes-file notes.md
          if ($LASTEXITCODE) { exit 1 }

      - name: Manifeste de version
        env:
          VERSION: ${{ steps.empreinte.outputs.version }}
          SHA256: ${{ steps.empreinte.outputs.sha256 }}
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python tools/publier_manifeste.py
          if ($LASTEXITCODE) { exit 1 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add derniere_version.json
          git commit -m "Manifeste : version $env:VERSION publiee"
          git push origin main
          if ($LASTEXITCODE) { exit 1 }
